.stage::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,249,235,.13),rgba(255,247,230,.10) 45%,rgba(255,246,226,.2));
}
canvas{position:relative;z-index:1;display:block;width:100%;height:100%;touch-action:pan-y}
.top-note,.hint{
  position:absolute;left:8px;right:8px;text-align:center;pointer-events:none;
  display:inline-block;width:max-content;max-width:calc(100% - 20px);
  margin:auto;padding:7px 11px;border-radius:999px;
  color:#4a2c26;background:#fff8e9dd;border:1px solid #d8a65b77;
  font-size:11px;box-shadow:0 2px 8px #5b32101a;
}
.top-note{top:10px}
.hint{bottom:10px}
.phrase{
  position:absolute;z-index:3;left:8px;right:8px;top:50%;
  transform:translateY(-50%) scale(.7);text-align:center;opacity:0;
  pointer-events:none;color:#8b3e21;font:bold clamp(27px,8vw,45px) Georgia,serif;
  text-shadow:0 2px 0 #fff7d8,0 0 15px #fff5cf;
}
.phrase.show{animation:phrasePop 2.7s ease both}
@keyframes phrasePop{
  0%{opacity:0;transform:translateY(-50%) scale(.5)}
  15%{opacity:1;transform:translateY(-50%) scale(1.12)}
  27%{transform:translateY(-50%) scale(1)}
  75%{opacity:1}
  100%{opacity:0;transform:translateY(-60%) scale(.92)}
}
.translation{
  text-align:center;color:#78452c;font-size:12px;min-height:16px;
  font-weight:bold;
}
.progress-wrap{height:5px;border-radius:9px;background:#7c4c3020;overflow:hidden}
.progress{height:100%;width:0%;background:linear-gradient(90deg,#dc7c38,#e8bf61);transition:width .18s}
.controls{display:flex;flex-direction:column;gap:8px}
.colors{display:flex;justify-content:center;gap:13px;padding:2px}
.swatch{
  width:28px;height:28px;border-radius:50%;padding:0;
  border:2px solid #ffffffd9;outline:2px solid transparent;
  outline-offset:2px;flex:none;box-shadow:0 2px 6px #42201420;
}
.swatch.active{outline-color:#a85b2a;transform:scale(1.08)}
.buttons{display:flex;gap:9px}
button{
  border:1px solid #a85b2a80;border-radius:13px;padding:12px 10px;
  color:#4c2b25;background:linear-gradient(135deg,#fff8e9,#f0d8b7);
  font-family:inherit;font-size:13px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 3px 9px #633b2010;
}
button:active{transform:scale(.97)}
.primary{
  flex:1;background:linear-gradient(135deg,#e9b95e,#d47a38);
  color:#351d17;font-weight:bold;
}
.secondary{min-width:100px}
button:disabled{opacity:.55}
.footer{text-align:center;font-size:9px;color:#8a6956;padding-bottom:1px}
@media(max-height:650px){
 .app{padding:7px;gap:6px}.brand{font-size:24px}header{padding:0}
 .stage{min-height:165px}.swatch{width:24px;height:24px}
 .buttons button{padding:9px}.stats{padding:7px 9px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">YOSRA</div>
    <div class="subtitle">CRUSH LAB · SOAP ASMR EXPERIENCE</div>
  </header>

  <div class="stats">
    <span>Coups : <strong id="hits">0 / 4</strong></span>
    <span>Score : <strong id="score">0</strong></span>
    <span id="status">Prêt !</span>
  </div>

  <main class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="top-note">Touche le savon plusieurs fois ✦</div>
    <div class="phrase" id="phrase">FAIRE LE BUZZ !</div>
    <div class="hint" id="hint">Donne 4 coups pour briser le savon</div>
  </main>

  <div class="translation" id="translation">Faire le buzz = devenir très populaire !</div>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <section class="controls">
    <div class="colors" id="colors">
      <button class="swatch active" data-color="#b78ae2" style="background:#b78ae2" aria-label="Violet"></button>
      <button class="swatch" data-color="#f2a8bc" style="background:#f2a8bc" aria-label="Rose"></button>
      <button class="swatch" data-color="#91d5cf" style="background:#91d5cf" aria-label="Turquoise"></button>
      <button class="swatch" data-color="#f2d17f" style="background:#f2d17f" aria-label="Doré"></button>
      <button class="swatch" data-color="#a9b9f5" style="background:#a9b9f5" aria-label="Bleu"></button>
    </div>
    <div class="buttons">
      <button class="primary" id="hitButton">✦ Frapper le savon</button>
      <button class="secondary" id="resetButton">↻ Recommencer</button>
    </div>
  </section>
  <div class="footer">YOSRA CRUSH LAB · UN PETIT COUP, UN GRAND BUZZ !</div>
</div>

<script>
(() => {
'use strict';
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const stage=document.getElementById('stage');
const hitsEl=document.getElementById('hits');
const scoreEl=document.getElementById('score');
const statusEl=document.getElementById('status');
const hintEl=document.getElementById('hint');
const phraseEl=document.getElementById('phrase');
const translationEl=document.getElementById('translation');
const progressEl=document.getElementById('progress');
const hitButton=document.getElementById('hitButton');
const resetButton=document.getElementById('resetButton');

let W=0,H=0,dpr=1,soap=null,particles=[],cracks=[],rings=[];
let phase='idle',hitCount=0,score=0,selectedColor='#b78ae2';
let raf=0,lastTime=0,nextTimer=0,phraseTimer=0,audioCtx=null;
const COLORS=['#b78ae2','#f2a8bc','#91d5cf','#f2d17f','#a9b9f5'];
const POWDERS={
 '#b78ae2':['#fff5ff','#f2d5ff','#e8c77b','#ffffff'],
 '#f2a8bc':['#fff3f6','#ffe3aa','#ffffff','#d8a4ed'],
 '#91d5cf':['#efffff','#d6f0c8','#ffe8ad','#ffffff'],
 '#f2d17f':['#fffbe9','#fff0b8','#f5d8ff','#ffffff'],
 '#a9b9f5':['#f5f7ff','#e4d8ff','#fff0b8','#ffffff']
};
const rand=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function rgb(hex){let s=hex.slice(1);if(s.length===3)s=s.split('').map(c=>c+c).join('');const n=parseInt(s,16);return{r:n>>16&255,g:n>>8&255,b:n&255}}
function rgba(hex,a){const c=rgb(hex);return`rgba(${c.r},${c.g},${c.b},${a})`}
function lighten(hex,t){const c=rgb(hex);return`rgb(${Math.round(c.r+(255-c.r)*t)},${Math.round(c.g+(255-c.g)*t)},${Math.round(c.b+(255-c.b)*t)}`}
function darken(hex,t){const c=rgb(hex);return`rgb(${Math.round(c.r*(1-t))},${Math.round(c.g*(1-t))},${Math.round(c.b*(1-t))}`}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function resize(){
 const r=stage.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);
 W=Math.max(1,r.width);H=Math.max(1,r.height);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(soap&&phase==='idle'){soap.x=W/2;soap.y=H*.49;soap.size=Math.min(W*.43,H*.31,155)}
 draw();
}
function createSoap(color){
 soap={x:W/2,y:H*.49,size:Math.min(W*.43,H*.31,155),color,rotation:rand(-.035,.035)};
 hitCount=0;cracks=[];rings=[];phase='idle';updateUI();
 statusEl.textContent='Prêt !';hintEl.textContent='Donne 4 coups pour briser le savon';
 translationEl.textContent='Faire le buzz = devenir très populaire !';hitButton.disabled=false;
}
function updateUI(){
 hitsEl.textContent=hitCount+' / 4';progressEl.style.width=(hitCount/4*100)+'%';scoreEl.textContent=score;
 document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===selectedColor));
}
function background(){
 ctx.clearRect(0,0,W,H);
 // A very light veil keeps the uploaded autumn illustration visible behind the soap.
 const veil=ctx.createLinearGradient(0,0,0,H);
 veil.addColorStop(0,'rgba(255,249,235,.05)');veil.addColorStop(1,'rgba(255,247,230,.13)');
 ctx.fillStyle=veil;ctx.fillRect(0,0,W,H);
 const now=performance.now()*.001;
 for(let i=0;i<22;i++){
  const x=(i*83.7+21)%W,y=(i*127.3+10)%H;
  ctx.fillStyle=`rgba(255,245,215,${.08+.06*Math.sin(now+i)})`;
  ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();
 }
}
function drawSoap(){
 if(!soap||phase==='powder'||phase==='phrase'||phase==='waiting')return;
 const s=soap.size,shake=phase==='cracking'?Math.sin(performance.now()*.08)*Math.min(5,hitCount):0;
 ctx.save();ctx.translate(soap.x+shake,soap.y);ctx.rotate(soap.rotation);
 ctx.save();ctx.translate(0,s*.59);ctx.scale(1,.24);
 const sh=ctx.createRadialGradient(0,0,2,0,0,s*.75);sh.addColorStop(0,'rgba(40,20,10,.32)');sh.addColorStop(1,'rgba(40,20,10,0)');
 ctx.fillStyle=sh;ctx.beginPath();ctx.arc(0,0,s*.78,0,Math.PI*2);ctx.fill();ctx.restore();
 const body=ctx.createLinearGradient(-s*.45,-s*.4,s*.4,s*.5);
 body.addColorStop(0,lighten(soap.color,.28));body.addColorStop(.5,soap.color);body.addColorStop(1,darken(soap.color,.24));
 ctx.shadowColor=rgba(soap.color,.5);ctx.shadowBlur=18;
 rounded(-s*.43,-s*.47,s*.86,s*.91,s*.19);ctx.fillStyle=body;ctx.fill();ctx.shadowBlur=0;
 ctx.save();rounded(-s*.43,-s*.47,s*.86,s*.91,s*.19);ctx.clip();
 const gloss=ctx.createLinearGradient(0,-s*.5,0,s*.4);
 gloss.addColorStop(0,'rgba(255,255,255,.52)');gloss.addColorStop(.5,'rgba(255,255,255,.09)');gloss.addColorStop(1,'rgba(0,0,0,.06)');
 ctx.fillStyle=gloss;ctx.fillRect(-s/2,-s/2,s,s);ctx.restore();
 rounded(-s*.43,-s*.47,s*.86,s*.91,s*.19);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.4;ctx.stroke();
 for(let i=0;i<18;i++){ctx.fillStyle=`rgba(255,255,255,${.04+(i%3)*.015})`;ctx.beginPath();ctx.arc(Math.sin(i*9)*s*.28,Math.cos(i*7)*s*.3,1.3,0,Math.PI*2);ctx.fill()}
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.95)';
 ctx.font=`italic ${Math.max(12,s*.105)}px Georgia`;ctx.fillText('YOSRA',0,-s*.025);
 ctx.strokeStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.moveTo(-s*.18,s*.075);ctx.lineTo(s*.18,s*.075);ctx.stroke();
 cracks.forEach(c=>{
  ctx.beginPath();c.points.forEach((p,i)=>i===0?ctx.moveTo(p.x*s,p.y*s):ctx.lineTo(p.x*s,p.y*s));
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='rgba(65,35,43,.88)';ctx.lineWidth=1+s*.008;ctx.stroke();
  ctx.beginPath();c.points.forEach((p,i)=>i===0?ctx.moveTo(p.x*s,p.y*s-s*.005):ctx.lineTo(p.x*s,p.y*s-s*.005));
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=Math.max(.6,s*.003);ctx.stroke();
 });
 ctx.restore();
}
function addCracks(x,y){
 if(!soap)return;const s=soap.size,ox=clamp((x-soap.x)/s,-.32,.32),oy=clamp((y-soap.y)/s,-.35,.35);
 const branches=hitCount===1?3:hitCount===2?5:8;
 for(let b=0;b<branches;b++){
  const a=Math.PI*2*b/branches+rand(-.35,.35);let px=ox,py=oy;const points=[{x:px,y:py}];
  for(let j=0;j<(hitCount===1?3:5);j++){
   const d=rand(.045,.105);px=clamp(px+Math.cos(a+rand(-.4,.4))*d,-.39,.39);py=clamp(py+Math.sin(a+rand(-.4,.4))*d,-.42,.42);points.push({x:px,y:py});
  }cracks.push({points});
 }
}
function burstAt(x,y,color,n){
 for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(1.5,6);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rand(.3,2),size:rand(1,4),color,age:0,life:rand(.3,.7),gravity:.04,drag:.98,alpha:1,spin:rand(-.1,.1),rotation:rand(0,6),square:Math.random()<.25})}
}
function hitSoap(){
 if(phase!=='idle'||!soap)return;hitCount++;
 const ox=rand(-soap.size*.24,soap.size*.24),oy=rand(-soap.size*.23,soap.size*.23);
 addCracks(soap.x+ox,soap.y+oy);burstAt(soap.x+ox,soap.y+oy,'#fff0d2',10+hitCount*3);playCrackSound(hitCount);updateUI();
 if(hitCount<4){
  phase='cracking';statusEl.textContent='Crac !';
  hintEl.textContent=['Encore un coup…','Les fissures s’agrandissent !','Presque brisé !'][hitCount-1]||'Encore un coup…';ensureAnimation();
  setTimeout(()=>{if(phase==='cracking'){phase='idle';statusEl.textContent='Continue !';ensureAnimation()}},170);
 }else{
  phase='cracking';statusEl.textContent='CRAC !';hintEl.textContent='Le savon va exploser en poudre !';ensureAnimation();
  setTimeout(()=>{if(phase==='cracking')explodeSoap()},220);
 }
}
function explodeSoap(){
 if(!soap||phase!=='cracking')return;const old=soap;phase='powder';statusEl.textContent='Poudre magique !';
 hintEl.textContent='Regarde la poudre voler…';hitButton.disabled=true;
 const palette=POWDERS[old.color]||['#fff','#e8c77b','#f5d6ff'];
 for(let i=0;i<360;i++){
  const a=rand(0,Math.PI*2),speed=rand(.7,6.5),fine=Math.random()<.87;
  particles.push({x:old.x+rand(-old.size*.34,old.size*.34),y:old.y+rand(-old.size*.36,old.size*.36),
   vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-rand(.4,2.6),size:fine?rand(.6,2.5):rand(2.5,6.5),
   color:pick(palette),age:0,life:rand(1.15,2.4),gravity:rand(.012,.085),drag:rand(.976,.994),
   alpha:1,rotation:rand(0,6),spin:rand(-.12,.12),square:!fine});
 }
 for(let i=0;i<70;i++){
  const a=rand(0,Math.PI*2),speed=rand(3,8);
  particles.push({x:old.x+rand(-old.size*.15,old.size*.15),y:old.y+rand(-old.size*.15,old.size*.15),
   vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-1.5,size:rand(.5,1.5),color:pick(palette),
   age:0,life:rand(1.4,2.3),gravity:.02,drag:.99,alpha:1,rotation:0,spin:0,square:false});
 }
 rings.push({x:old.x,y:old.y,r:10,alpha:.85});soap=null;score+=100;updateUI();playExplosionSound();ensureAnimation();speakFrench('Faire le buzz !');
}
function drawParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.age+=dt;if(p.age>=p.life){particles.splice(i,1);continue}
  p.vx*=Math.pow(p.drag,dt*60);p.vy*=Math.pow(p.drag,dt*60);p.vy+=p.gravity*dt*60;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.rotation+=p.spin*dt*60;
  const t=p.age/p.life;p.alpha=clamp(t<.42?1:Math.pow(1-(t-.42)/.58,1.4),0,1);
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;
  if(p.square){rounded(-p.size/2,-p.size/2,p.size,p.size,1);ctx.fill()}else{ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill()}ctx.restore();
 }
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=dt*130;r.alpha-=dt*.65;if(r.alpha<=0){rings.splice(i,1);continue}
  ctx.strokeStyle=`rgba(190,111,43,${r.alpha})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}
}
function playNoise(duration,volume,filterType,frequency){
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
  const len=Math.floor(audioCtx.sampleRate*duration),buffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<len;i++){const t=i/len;data[i]=(Math.random()*2-1)*Math.pow(1-t,filterType==='lowpass'?1.3:3)}
  const src=audioCtx.createBufferSource();src.buffer=buffer;const filter=audioCtx.createBiquadFilter();filter.type=filterType;filter.frequency.value=frequency;
  const gain=audioCtx.createGain();gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start();
 }catch(e){}
}
function playCrackSound(n){playNoise(.06+n*.009,.13,'highpass',650+n*130)}
function playExplosionSound(){playNoise(.48,.12,'lowpass',2300);setTimeout(()=>playNoise(.3,.045,'highpass',1800),100)}
function speakFrench(text){
 if(!('speechSynthesis'in window))return;
 try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;u.pitch=1.08;u.volume=1;
  const fr=window.speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));if(fr)u.voice=fr;window.speechSynthesis.speak(u)
 }catch(e){}
}
function showPhrase(){
 phase='phrase';phraseEl.classList.remove('show');void phraseEl.offsetWidth;phraseEl.classList.add('show');
 statusEl.textContent='FAIRE LE BUZZ !';hintEl.textContent='Bravo ! Le savon a fait le buzz !';
 translationEl.textContent='Faire le buzz ! = devenir viral, faire sensation.';speakFrench('Faire le buzz !');phraseTimer=performance.now();
}
function nextSoap(){
 selectedColor=pick(COLORS.filter(c=>c!==selectedColor));document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===selectedColor));
 createSoap(selectedColor);statusEl.textContent='À toi de jouer !';hintEl.textContent='Frappe 4 fois le nouveau savon';
}
function draw(){background();drawSoap();drawParticles(0)}
function animate(now){
 const dt=lastTime?Math.min((now-lastTime)/1000,.04):.016;lastTime=now;background();drawSoap();drawParticles(dt);
 if(phase==='powder'&&particles.length===0&&rings.length===0)showPhrase();
 if(phase==='phrase'&&now-phraseTimer>2600){phraseEl.classList.remove('show');phase='waiting';statusEl.textContent='Nouveau savon bientôt…';nextTimer=now+450}
 if(phase==='waiting'&&now>=nextTimer)nextSoap();
 if(phase!=='idle'||particles.length||rings.length){raf=requestAnimationFrame(animate)}else{raf=0}
}
function ensureAnimation(){if(!raf){lastTime=0;raf=requestAnimationFrame(animate)}}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function isOnSoap(p){return soap&&Math.abs(p.x-soap.x)<soap.size*.52&&Math.abs(p.y-soap.y)<soap.size*.56}
canvas.addEventListener('pointerdown',e=>{if(phase!=='idle')return;const p=point(e);if(isOnSoap(p)){e.preventDefault();hitSoap()}});
hitButton.addEventListener('click',()=>{if(phase==='idle')hitSoap()});
resetButton.addEventListener('click',()=>{
 if('speechSynthesis'in window)window.speechSynthesis.cancel();particles=[];cracks=[];rings=[];hitCount=0;score=0;phase='idle';phraseEl.classList.remove('show');selectedColor='#b78ae2';createSoap(selectedColor);updateUI();ensureAnimation();
});
document.querySelectorAll('.swatch').forEach(btn=>btn.addEventListener('click',()=>{if(phase!=='idle')return;selectedColor=btn.dataset.color;createSoap(selectedColor);ensureAnimation()}));
window.addEventListener('resize',resize);
resize();createSoap(selectedColor);draw();
})();
</script>
